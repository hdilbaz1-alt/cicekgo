# ÇiçekGo host nginx reverse proxy (AlmaLinux). Cloudflare proxied (Full/strict) → Origin Cert.
# Sertifika: /etc/nginx/ssl/cicekgo-origin.pem (cert) + /etc/nginx/ssl/cicekgo-origin.key
# Kurulum: bu dosyayı /etc/nginx/conf.d/cicekgo.conf olarak koy, `nginx -t && systemctl reload nginx`.

# HTTP → HTTPS (Cloudflare zaten https; yine de yönlendir)
server {
    listen 80;
    listen [::]:80;
    server_name cicekgo.net customer-backend.cicekgo.net webmail.cicekgo.net;
    return 301 https://$host$request_uri;
}

# Frontend (panel) — cicekgo.net
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name cicekgo.net;

    ssl_certificate     /etc/nginx/ssl/cicekgo-origin.pem;
    ssl_certificate_key /etc/nginx/ssl/cicekgo-origin.key;

    client_max_body_size 25m;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }
}

# Backend API — customer-backend.cicekgo.net
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name customer-backend.cicekgo.net;

    ssl_certificate     /etc/nginx/ssl/cicekgo-origin.pem;
    ssl_certificate_key /etc/nginx/ssl/cicekgo-origin.key;

    client_max_body_size 25m;

    location / {
        proxy_pass http://127.0.0.1:5080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 120s;
    }
}

# Webmail (Roundcube) — webmail.cicekgo.net
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name webmail.cicekgo.net;

    ssl_certificate     /etc/nginx/ssl/cicekgo-origin.pem;
    ssl_certificate_key /etc/nginx/ssl/cicekgo-origin.key;

    client_max_body_size 50m;

    location / {
        proxy_pass http://127.0.0.1:8083;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }
}
