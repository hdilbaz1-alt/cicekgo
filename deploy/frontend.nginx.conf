server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # PWA: service worker ve sürüm dosyası asla cache'lenmesin (anlık güncelleme)
    location = /sw.js        { add_header Cache-Control "no-cache, no-store, must-revalidate"; }
    location = /version.json { add_header Cache-Control "no-cache, no-store, must-revalidate"; }
    location = /manifest.json { add_header Cache-Control "no-cache"; }

    # Next statik varlıkları uzun süre cache
    location /_next/static/ { expires 1y; add_header Cache-Control "public, immutable"; }

    # trailingSlash:true → /login/ → /login/index.html
    location / {
        try_files $uri $uri/ $uri.html /index.html;
    }
}
